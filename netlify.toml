# Static site. No build step, no framework. index.html at the root.
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Two no-op stubs stand in for the Issuance Express platform scripts, which only
# exist on their host. Serving an empty 200 keeps a blocking 404 out of the head
# on this domain while index.html stays byte-identical on both hosts.
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
